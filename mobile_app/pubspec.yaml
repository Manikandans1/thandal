name: thandal
description: "Thandal - one app for customers, agents and admins. Login decides which experience opens."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  intl: ^0.19.0
  # Added to connect this app to the Thandal backend:
  razorpay_flutter: ^1.3.7   # online chit payments (customer app)
  image_picker: ^1.1.2       # ID-proof photo capture (agent + admin apps)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
