version: "3.8"
services:
  app:
    build: .
    volumes: ["./:/var/www"]
    env_file: .env
    depends_on: [db]
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./:/var/www", "./docker/nginx.conf:/etc/nginx/conf.d/default.conf"]
    depends_on: [app]
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: thandal
      MYSQL_USER: thandal
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes: ["dbdata:/var/lib/mysql"]
    ports: ["3306:3306"]
  scheduler:
    build: .
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes: ["./:/var/www"]
    env_file: .env
    depends_on: [db]
  queue:
    build: .
    command: php artisan queue:work --tries=3
    volumes: ["./:/var/www"]
    env_file: .env
    depends_on: [db]
volumes:
  dbdata:
